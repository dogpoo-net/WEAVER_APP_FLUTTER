# Include in the Weaver server block. The server root must be the web build.
# expires adds Cache-Control without overriding inherited security headers.
location ^~ /_immutable/ {
    try_files $uri =404;
    expires 365d;
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_comp_level 4;
    gzip_types application/javascript text/javascript application/wasm
               application/json font/ttf application/x-font-ttf application/octet-stream;
}

location = /index.html {
    try_files $uri =404;
    expires -1;
}

location = /flutter_bootstrap.js {
    try_files $uri =404;
    expires -1;
}
