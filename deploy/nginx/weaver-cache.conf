# Include in the Weaver server block. The server root must be the web build.
# expires adds Cache-Control without overriding inherited security headers.
location ^~ /_immutable/ {
    try_files $uri =404;
    expires 365d;
}

location = /index.html {
    try_files $uri =404;
    expires -1;
}

location = /flutter_bootstrap.js {
    try_files $uri =404;
    expires -1;
}
