<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="weaver">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png?v=weaver-logo-2">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png?v=weaver-logo-2"/>

  <title>weaver</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html, body { margin: 0; background: #121318; }
    #weaver-loading {
      position: fixed; inset: 0; display: grid; place-items: center;
      background: #121318; z-index: 9999; perspective: 600px;
    }
    #weaver-loading img { width: 192px; height: 192px; object-fit: contain; }
    #weaver-loading.leaving { pointer-events: none; animation: weaver-reveal 300ms ease-in forwards; }
    #weaver-loading.leaving img {
      will-change: transform, opacity;
      animation: weaver-depart 300ms cubic-bezier(.3, 0, .65, 1) forwards;
    }
    @keyframes weaver-depart {
      0% { transform: translateZ(0); opacity: 1; }
      28% { transform: translateZ(90px); opacity: 1; }
      100% { transform: translateZ(-1800px) scale(.15); opacity: 0; }
    }
    @keyframes weaver-reveal { 0%, 28% { opacity: 1; } 100% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) {
      #weaver-loading.leaving, #weaver-loading.leaving img { animation: none; }
    }
  </style>
</head>
<body>
  <div id="weaver-loading" role="status" aria-label="WEAVER 로딩 중">
    <img src="icons/loading-logo.png" alt="WEAVER" width="192" height="192">
  </div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      const loading = document.getElementById('weaver-loading');
      if (!loading) return;
      if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
        loading.remove();
        return;
      }
      loading.addEventListener('animationend', function (event) {
        if (event.target === loading) loading.remove();
      });
      loading.classList.add('leaving');
      // Also release the overlay when animation events are suppressed by the browser.
      window.setTimeout(() => loading.remove(), 400);
    }, { once: true });
  </script>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
