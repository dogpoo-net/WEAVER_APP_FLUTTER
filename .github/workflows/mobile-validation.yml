name: Validate Google login
on:
  push:
    branches: [codex/google-login]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          git clone --depth 1 --branch 3.47.9 https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - run: flutter pub get
      - name: Report resolved dependencies
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64, zlib
          encoded = base64.b64encode(zlib.compress(Path('pubspec.lock').read_bytes())).decode()
          for i in range(0, len(encoded), 2000):
              print(f'::notice title=LOCK {i//2000:03d}::{encoded[i:i+2000]}')
          PY
      - name: Validate
        run: |
          set +e
          flutter analyze > /tmp/analysis.log 2>&1
          result=$?
          cat /tmp/analysis.log
          python3 - <<'PY'
          from pathlib import Path
          message = Path('/tmp/analysis.log').read_text().replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
          print(f'::notice title=Analysis::{message}')
          PY
          exit "$result"
      - name: Test
        run: |
          set +e
          flutter test --reporter expanded > /tmp/tests.log 2>&1
          result=$?
          cat /tmp/tests.log
          python3 - <<'PYTHON'
          from pathlib import Path
          output = Path('/tmp/tests.log').read_text()
          blocks = output.split('══╡ EXCEPTION CAUGHT BY ')
          if 'Some tests failed' in output:
              for part in blocks[1:] or [output[-12000:]]:
                  message = part.split('\n════════')[0].replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
                  print(f'::error title=Test failure::{message}')
          PYTHON
          exit "$result"
      - run: flutter build web --release --base-href /WEAVER_APP_FLUTTER/
      - name: Android build
        run: |
          set +e
          flutter build apk --debug --target-platform android-arm64 > /tmp/android.log 2>&1
          result=$?
          cat /tmp/android.log
          if [ "$result" -ne 0 ]; then
            python3 - <<'PYTHON'
          from pathlib import Path
          message = Path('/tmp/android.log').read_text()[-3500:].replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
          print(f'::error title=Android build::{message}')
          PYTHON
          fi
          exit "$result"
