name: Deploy Flutter web to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Flutter SDK
        shell: bash
        run: |
          git clone --depth 1 --branch 3.47.9 https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          test "$(git -C "$RUNNER_TEMP/flutter" rev-parse HEAD)" = c197ca5199e9ee5661e865596c9c07294dfab51c
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - run: flutter config --no-analytics
      - run: flutter pub get --enforce-lockfile
      - run: flutter analyze --no-pub
      - name: Test and report failures
        shell: bash
        run: |
          set +e
          flutter test --no-pub --reporter expanded > "$RUNNER_TEMP/flutter-test.log" 2>&1
          result=$?
          cat "$RUNNER_TEMP/flutter-test.log"
          if [ "$result" -ne 0 ]; then
            python3 - <<'PYTHON'
          import os
          from pathlib import Path
          output = (Path(os.environ['RUNNER_TEMP']) / 'flutter-test.log').read_text()
          # Expose test diagnostics in the run summary as well as job logs.
          blocks = output.split('══╡ EXCEPTION CAUGHT BY ')
          diagnostics = [part.split('\n', 1)[-1].split('\n════════')[0] for part in blocks[1:]] or [output[-12000:]]
          for diagnostic in diagnostics:
              message = diagnostic.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
              print(f'::error title=Flutter test failure::{message}')
          PYTHON
          fi
          exit "$result"
      - name: Build project Pages site
        run: flutter build web --release --no-pub --base-href /WEAVER_APP_FLUTTER/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
